<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF黒塗りツール</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header>
  <h1>PDF黒塗り</h1>
  <span class="badge">ローカル完結 / 外部送信なし</span>
</header>

<div id="drop" class="drop">
  <p><strong>PDFをドロップ</strong> または</p>
  <label class="btn">ファイルを選ぶ<input type="file" id="file" accept="application/pdf" hidden></label>
  <p class="note">選択範囲のテキスト・画像データそのものを削除してから黒塗りします。<br>コピペやOCRで中身が読めることはありません。</p>
</div>

<main id="app" hidden>
  <div class="toolbar">
    <button id="prev">‹ 前</button>
    <span id="pageinfo">1 / 1</span>
    <button id="next">次 ›</button>
    <span class="sep"></span>
    <input id="term" type="search" placeholder="語句で一括黒塗り（例: 氏名）">
    <button id="searchBtn">全ページ検索して追加</button>
    <span class="sep"></span>
    <button id="undo">直前を取消</button>
    <button id="clearPage">このページを全消し</button>
    <span class="sep"></span>
    <label class="chk"><input type="checkbox" id="raster"> 画像化して出力（最強・検索不可）</label>
    <button id="apply" class="primary">黒塗りして保存</button>
  </div>
  <div class="status"><span id="count">0個の領域</span><span id="msg"></span></div>
  <div class="stage">
    <div class="canvaswrap" id="wrap">
      <img id="pageimg" alt="ページ">
      <div id="overlay" class="overlay"></div>
    </div>
  </div>
</main>

<script src="/app.js"></script>
</body>
</html>
